services:
  - type: web
    name: keyauth-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: keyauth-db
          property: connectionString

databases:
  - name: keyauth-db
    plan: free
